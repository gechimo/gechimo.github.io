<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>gechimo</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      color: #4b5b6a;
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.95) 0 70px, transparent 71px),
        radial-gradient(circle at 80% 15%, rgba(255,255,255,0.85) 0 55px, transparent 56px),
        radial-gradient(circle at 70% 35%, rgba(255,255,255,0.7) 0 40px, transparent 41px),
        linear-gradient(180deg, #dff4ff 0%, #eefbff 35%, #ffffff 100%);
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 88px 20px 56px;
      position: relative;
    }

    .hero-cloud {
      width: min(720px, 92%);
      margin: 0 auto;
      background: rgba(255,255,255,0.82);
      border: 2px solid rgba(196, 232, 255, 0.9);
      border-radius: 40px;
      padding: 36px 24px;
      box-shadow: 0 10px 30px rgba(143, 201, 232, 0.22);
      backdrop-filter: blur(4px);
    }

    h1 {
      margin: 0;
      font-size: 42px;
      letter-spacing: 2px;
      color: #6aaed6;
    }

    .subtitle {
      margin: 12px 0 0;
      color: #7b97ab;
      font-size: 15px;
      line-height: 1.8;
    }

    nav {
      margin-top: 24px;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    nav a {
      text-decoration: none;
      color: #6aaed6;
      background: #ffffff;
      border: 1.5px solid #cfefff;
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 14px;
      box-shadow: 0 4px 12px rgba(143, 201, 232, 0.15);
    }

    main {
      max-width: 980px;
      margin: 0 auto;
      padding: 0 18px 80px;
    }

    section {
      margin-top: 28px;
    }

    .section-box {
      background: rgba(255,255,255,0.78);
      border: 2px solid rgba(209, 237, 255, 0.95);
      border-radius: 32px;
      padding: 28px 20px;
      box-shadow: 0 10px 28px rgba(143, 201, 232, 0.14);
    }

    h2 {
      margin: 0 0 18px;
      text-align: center;
      color: #74b8de;
      font-size: 24px;
    }

    .section-text {
      text-align: center;
      color: #7b97ab;
      font-size: 14px;
      line-height: 1.9;
      margin-bottom: 24px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 18px;
    }

    .card {
      background: linear-gradient(180deg, #ffffff 0%, #f7fcff 100%);
      border: 1.5px solid #d9f1ff;
      border-radius: 28px;
      padding: 24px;
      box-shadow: 0 8px 20px rgba(150, 208, 238, 0.15);
    }

    .card h3 {
      margin-top: 0;
      margin-bottom: 10px;
      color: #66abd3;
      font-size: 22px;
      text-align: center;
    }

    .card p {
      margin: 0 0 18px;
      font-size: 14px;
      line-height: 1.9;
      color: #6e8799;
      text-align: center;
    }

    .button-wrap {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      text-decoration: none;
      background: #ffffff;
      color: #67add5;
      border: 1.5px solid #cdeeff;
      padding: 11px 18px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 700;
      box-shadow: 0 4px 12px rgba(143, 201, 232, 0.15);
    }

    .about-box {
      text-align: center;
      font-size: 14px;
      line-height: 2;
      color: #6e8799;
    }

    footer {
      text-align: center;
      padding: 36px 20px 50px;
      color: #9bb7c9;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 34px;
      }

      .hero-cloud {
        padding: 28px 18px;
      }

      .section-box {
        padding: 22px 16px;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="hero-cloud">
      <h1>gechimo</h1>
      <p class="subtitle">
        games / web / cute cloud-like portfolio<br>
        つくったものを、ふわっとまとめる場所
      </p>

      <nav>
        <a href="#games">Games</a>
        <a href="#about">About</a>
        <a href="https://github.com/gechimo">GitHub</a>
      </nav>
    </div>
  </header>

  <main>
    <section id="games">
      <div class="section-box">
        <h2>Games</h2>
        <p class="section-text">
          いま公開しているゲームです。
        </p>

        <div class="grid">
          <div class="card">
            <h3>薬味タワー 2</h3>
            <p>
              GitHub Pagesで公開中のゲーム。<br>
              遊ぶ用リンクと、ソースコードのリンクをまとめています。
            </p>

            <div class="button-wrap">
              <a class="btn" href="https://gechimo.github.io/yakumi-tower2/">PLAY</a>
              <a class="btn" href="https://github.com/gechimo/yakumi-tower2">GitHub</a>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section id="about">
      <div class="section-box">
        <h2>About</h2>
        <div class="about-box">
          ゲームやWeb制作など、<br>
          そのとき気になったものを少しずつ作っています。<br><br>
          ここは、公開中の制作物をまとめるための個人サイトです。
        </div>
      </div>
    </section>
  </main>

  <footer>
    © gechimo
  </footer>

</body>
</html>
